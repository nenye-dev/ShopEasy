<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="style.css">
    <script type="text/babel">
        function SearchInput({searchText,setSearchText}){
            function handleSearch(event){
                setSearchText(event.target.value)
            }
            return(
                
               <input 
                className="search-input"
                type="text"
                placeholder="Search for products"
                value={searchText}
                onChange={handleSearch}
                />
                
            );
        }
        function DropdownMenu({selectedCategory,setSelectedCategory}){
            return(
                < div className="dropdown">
                <select
                    value ={selectedCategory}
                    onChange={(event)=>setSelectedCategory(event.target.value)}
                >
                    <option>All Categories</option>
                    <option>Electronics</option>
                    <option>Clothes</option>
                    <option>Shoes</option>
                    <option>Accessories</option>
                    
                </select>
                </div>
            );
        }
        function Header({searchText,setSearchText,selectedCategory,setSelectedCategory}){
            return(
                <header>
                <h1><i data-lucide="shopping-cart"></i>ShopEasy</h1>
                <SearchInput
                searchText={searchText}
                setSearchText={setSearchText}
                 />
                <DropdownMenu
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                 />
                </header>


            )
        }
        function Products({product,setCart}){
            function addToCart(){
                setCart((cart)=>{
                        const existingProduct=cart.find((item)=>item.id === product.id);
                        if(existingProduct){
                            return cart.map((item)=>{
                                if(item.id === product.id){
                                    return{...item,quantity:item.quantity +1};
                                }
                                return item;
                        
                    });
                }
                    return [...cart,{...product,quantity:1}];

                });
            }
            return(
                <div className="product-card">
                <img src={product.image} width="60" />
                <p>{product.productName}</p>
                <p>₦{product.price}</p>
                <p>{product.category}</p>
                <button onClick={addToCart}>Add to Cart</button>
                </div>
            );

        }
        function Cart({cart,setCart}){
            function increaseQuantity(id){
                setCart((cart)=>{
                    return cart.map((item)=>{
                        if(item.id ===id){
                            return {...item, quantity:item.quantity +1};
                        }
                        return item;
                    });
                });
            }
            function decreaseQuantity(id){
                setCart((cart)=>{
                    return cart.map((item)=>{
                        if(item.id=== id && item.quantity >1){
                            return {...item, quantity:item.quantity-1};
                        }
                        return item;
                    });
                });
            }
            const total=cart.reduce((sum,item)=>{
                return sum +Number(item.price.replace(/,/g,''))*item.quantity;
            },0)
            function removeCartItem(id){
                setCart((cart)=>{
                    return cart.filter((item)=>{
                        return item.id !==id;
                    });
                });
            }
            function clearCart(){
                setCart([]);
            }
            return(
                <div className="cart">
                     <h2>My Cart</h2>
                     {cart.length ===0 &&(
                     <p>Your cart is empty.Add some Items!</p>
                     )}
                     {cart.map((item)=>(
                        <div className="cart-item" key={item.id}>
                            <img src={item.image} width= "50" />
                            <div className="cart-description">
                                <p>{item.productName}</p>
                                <p>₦{item.price}</p>
                                <p>{item.category}</p>
                             <div className="quality-control">
                                <button onClick={()=>decreaseQuantity(item.id)}>-</button>
                                <span>{item.quantity}</span>
                                <button onClick={()=>increaseQuantity(item.id)}>+</button>
                             </div>
                            </div>
                            <div className="remove">
                                <button onClick={()=>removeCartItem(item.id)}><i data-lucide="trash"></i> </button>
                            </div>
                            

                        </div>

                     ))}
                     {cart.length >0 &&(
                        <h3>Total: ₦{total.toLocaleString()}</h3>
                     )}
                     {cart.length >0 &&
                        <button className="clear-cart" onClick={clearCart}>Clear Cart</button>

                     }
                     
                </div>
                
            )

        }
        function App(){
            React.useEffect(() => {
                 lucide.createIcons();
            });
            const[searchText,setSearchText]=React.useState('');
            const [selectedCategory,setSelectedCategory]=React.useState('All Categories');
            const [cart,setCart]=React.useState(()=>{
                const savedCart=localStorage.getItem('cart');
                return savedCart ? JSON.parse(savedCart) :[];
            });
            React.useEffect(()=>{
                localStorage.setItem('cart',JSON.stringify(cart));

            },[cart])
            const [products]=React.useState(
                [
                    {
                        image:"images/Earbuds.jpeg",
                        productName: 'Earbuds',
                        price:'15,000',
                        category:'Electronics',
                        id:'id1'
                    },{
                        image:"images/basic top.jpeg",
                        productName: 'Purple Basic Top',
                        price:'18,000',
                        category:'Clothes',
                        id:'id2' 
                    },{
                        image:"images/adidas sambas.png",
                        productName: 'Adidas Sambas',
                        price:'25,000',
                        category:'Shoes',
                        id:'id3'
                    },{
                        image:"images/earrings.jpeg",
                        productName: 'Gold Earring',
                        price:'10,000',
                        category:'Accessories',
                        id:'id4'
                    },{
                        image:"images/iphone 16.jpeg",
                        productName: 'Iphone 16',
                        price:'1,700,000',
                        category:'Electronics',
                        id:'id5'
                    },{
                         image:"images/jeans.jpeg",
                         productName: 'Jeans',
                         price:'30,000',
                         category:'Clothes',
                         id:'id6'
                    },{
                         image:"images/airforce.jpeg",
                         productName: 'Nike Airforces',
                         price:'35,000',
                         category:'Shoes',
                         id:'id7'
                    },{
                         image:"images/iphone 17 Air.jpeg",
                         productName: 'Iphone 17 Air',
                         price:'3,000,000',
                         category:'Electronics',
                         id:'id8'
                    },{
                         image:"images/capris.jpeg",
                         productName: 'Capris',
                         price:'15,000',
                         category:'Clothes',
                         id:'id9'
                    },{
                         image:"images/hermes.jpeg",
                         productName: 'Hermes Footwear',
                         price:'25,000',
                         category:'Shoes',
                         id:'id10'
                    },{
                         image:"images/hoodie.jpeg",
                         productName: 'Black Hoodie',
                         price:'20,000',
                         category:'Clothes',
                         id:'id11'
                    },{
                         image:"images/ipad.jpeg",
                         productName: 'Ipad',
                         price:'1,700,000',
                         category:'Electronics',
                         id:'id12'
                    },{
                         image:"images/gold necklace.jpeg",
                         productName: 'Gold Neckpiece',
                         price:'65,000',
                         category:'Accessories',
                         id:'id13'
                    },{
                         image:"images/smartwatch.jpeg",
                         productName: 'Pink Smartwatch',
                         price:'80,000',
                         category:'Accessories',
                         id:'id14'
                    },{
                         image:"images/Crocs.jpeg",
                         productName: 'Crocs',
                         price:'30,000',
                         category:'Shoes',
                         id:'id15'
                    },{
                         image:"images/birkenstock.jpeg",
                         productName: 'Brown Birkins',
                         price:'75,000',
                         category:'Shoes',
                         id:'id16'
                    },{
                         image:"images/silvernecklace.jpeg",
                         productName: 'Silver Neckpiece',
                         price:'50,000',
                         category:'Accessories',
                         id:'id17'
                    },{
                         image:"images/gold watch.jpeg",
                         productName: 'Gold Watch',
                         price:'100,000',
                         category:'Accessories',
                         id:'id18'
                    },{
                         image:"images/top.jpeg",
                         productName: 'Blue Basic Top',
                         price:'22,000',
                         category:'Clothes',
                         id:'id19'
                    },{
                         image:"images/goldnosering.jpeg",
                         productName: 'Gold Nosering',
                         price:'12,000',
                         category:'Accessories',
                         id:'id20'
                    }
                ]
            );
            const filteredProducts=products.filter((product)=>{
                return(
                (searchText === '' ||
                 product.productName.toLowerCase().includes(searchText.toLowerCase()))
                 &&
                 (selectedCategory === 'All Categories' ||
                 product.category === selectedCategory)
            );
            });
            return(
                <>
                <Header
                searchText={searchText}
                setSearchText={setSearchText}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                 />
                <div className="shop-layout">
                    <div className="product-container">
                {filteredProducts.map((product)=>(
                    <Products 
                    product={product}
                    key={product.id}
                    setCart={setCart}
                     />
                ))}
                {filteredProducts.length ===0 &&(
                    <p>No Items Match your Search</p>
                )}
                </div>
                < Cart 
                cart={cart} 
                setCart={setCart}
                />
                </div>
                </>
            );

        }
        const container=document.querySelector('.js-container')
        ReactDOM.createRoot(container).render(<App />)
        
    </script>
</body>
</html>
